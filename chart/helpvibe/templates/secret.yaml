{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helpvibe.fullname" . }}
  labels: {{- include "helpvibe.labels" . | nindent 4 }}
type: Opaque
stringData:
  RAILS_MASTER_KEY: {{ required "secrets.railsMasterKey is required (contents of config/master.key)" .Values.secrets.railsMasterKey | quote }}
  HELPVIBE_DATABASE_PASSWORD: {{ required "secrets.databasePassword is required" .Values.secrets.databasePassword | quote }}
  HELPVIBE_WIDGET_SECRET: {{ .Values.secrets.widgetSecret | quote }}
  HELPVIBE_BACKUP_KEY: {{ .Values.secrets.backupKey | quote }}
  SENDGRID_API_KEY: {{ .Values.secrets.sendgridApiKey | quote }}
  RAILS_INBOUND_EMAIL_PASSWORD: {{ .Values.secrets.inboundEmailPassword | quote }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
