# Deploy helpvibe to one small server (AWS t4g.small, 2 GB, Graviton/arm64)
# with Postgres on the same box. See replica/deploy.md for the full runbook.
#
#   HELPVIBE_HOST=<server ip> HELPVIBE_DOMAIN=help.ourcompany.com bin/kamal setup   # first time
#   bin/kamal deploy                                                                  # after that
service: helpvibe
image: helpvibe

servers:
  web:
    - <%= ENV.fetch("HELPVIBE_HOST", "192.0.2.10") %>

# TLS via Let's Encrypt, terminated by kamal-proxy on the server.
proxy:
  ssl: true
  host: <%= ENV.fetch("HELPVIBE_DOMAIN", "help.example.com") %>

# Kamal's local registry: the image is built here and pushed over SSH, so no
# paid registry account is needed.
registry:
  server: localhost:5555

builder:
  arch: arm64

env:
  secret:
    - RAILS_MASTER_KEY
    - HELPVIBE_DATABASE_PASSWORD
    - HELPVIBE_WIDGET_SECRET
    - HELPVIBE_BACKUP_KEY
    - SENDGRID_API_KEY
    - RAILS_INBOUND_EMAIL_PASSWORD
  clear:
    DB_HOST: helpvibe-db
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 1          # one Puma process
    RAILS_MAX_THREADS: 3        # memory budget for a 2 GB box (replica/architecture.md)
    RUBY_YJIT_ENABLE: 1
    HELPVIBE_DOMAIN: <%= ENV.fetch("HELPVIBE_DOMAIN", "help.example.com") %>
    HELPVIBE_INBOUND_DOMAIN: "<%= ENV.fetch("HELPVIBE_INBOUND_DOMAIN", "") %>"
    HELPVIBE_MAIL_FROM: <%= ENV.fetch("HELPVIBE_MAIL_FROM", "help@example.com") %>
    HELPVIBE_FRAME_ANCESTORS: <%= ENV.fetch("HELPVIBE_FRAME_ANCESTORS", "'self'") %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Uploaded files (Active Storage, Disk service) live on the server's encrypted disk.
volumes:
  - "helpvibe_storage:/rails/storage"

asset_path: /rails/public/assets

accessories:
  db:
    image: postgres:17
    host: <%= ENV.fetch("HELPVIBE_HOST", "192.0.2.10") %>
    port: "127.0.0.1:5432:5432"     # reachable from the server only
    env:
      clear:
        POSTGRES_USER: helpvibe
        POSTGRES_DB: helpvibe_production
      secret:
        - POSTGRES_PASSWORD
    cmd: postgres -c shared_buffers=256MB -c max_connections=40 -c work_mem=8MB
    directories:
      - data:/var/lib/postgresql/data
